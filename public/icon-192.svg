<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03071e" />
      <stop offset="100%" stop-color="#0d1b4b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <!-- Outer orbital ring -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="#4fc3f7" stroke-width="2.5" stroke-dasharray="14 8" opacity="0.75" />
  <circle cx="96" cy="96" r="54" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <!-- Center Core -->
  <circle cx="96" cy="96" r="38" fill="#09143c" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)" />
  <!-- Waveform Bars -->
  <g fill="url(#neonCyan)">
    <rect x="70" y="88" width="4" height="16" rx="2" />
    <rect x="77" y="80" width="4" height="32" rx="2" />
    <rect x="84" y="74" width="4" height="44" rx="2" />
    <rect x="91" y="68" width="4" height="56" rx="2" />
    <rect x="98" y="72" width="4" height="48" rx="2" />
    <rect x="105" y="80" width="4" height="32" rx="2" />
    <rect x="112" y="86" width="4" height="20" rx="2" />
    <rect x="119" y="90" width="4" height="12" rx="2" />
  </g>
  <!-- Orbit nodes -->
  <circle cx="96" cy="28" r="4" fill="#4fc3f7" filter="url(#glow)" />
  <circle cx="164" cy="96" r="3.5" fill="#a78bfa" filter="url(#glow)" />
</svg>
