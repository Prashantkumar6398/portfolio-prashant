<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03071e" />
      <stop offset="100%" stop-color="#0d1b4b" />
    </linearGradient>
    <linearGradient id="neonCyan512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  <!-- Outer orbital rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#4fc3f7" stroke-width="6" stroke-dasharray="32 20" opacity="0.8" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="#a78bfa" stroke-width="4.5" stroke-dasharray="20 16" opacity="0.65" />
  <!-- Center Core -->
  <circle cx="256" cy="256" r="100" fill="#09143c" stroke="#4fc3f7" stroke-width="5" filter="url(#glow512)" />
  <!-- Waveform Bars -->
  <g fill="url(#neonCyan512)">
    <rect x="186" y="235" width="10" height="42" rx="5" />
    <rect x="206" y="215" width="10" height="82" rx="5" />
    <rect x="226" y="195" width="10" height="122" rx="5" />
    <rect x="246" y="180" width="10" height="152" rx="5" />
    <rect x="266" y="190" width="10" height="132" rx="5" />
    <rect x="286" y="210" width="10" height="92" rx="5" />
    <rect x="306" y="225" width="10" height="62" rx="5" />
    <rect x="326" y="238" width="10" height="36" rx="5" />
  </g>
  <!-- Orbit nodes -->
  <circle cx="256" cy="76" r="10" fill="#4fc3f7" filter="url(#glow512)" />
  <circle cx="436" cy="256" r="9" fill="#a78bfa" filter="url(#glow512)" />
  <circle cx="120" cy="340" r="7" fill="#34d399" filter="url(#glow512)" />
</svg>
